[project]
name = "spark-datasources"
version = "0.1.0"
description = "Custom PySpark data sources: pure Python vs Rust (maturin) vs Cython"
requires-python = ">=3.10"
dependencies = ["pyspark>=4.0", "pyarrow", "orjson", "sparkhttp-rs", "sparkhttp-cy"]

[dependency-groups]
dev = ["pytest", "marimo", "pandas<3", "altair", "amqtt", "paho-mqtt"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.workspace]
members = ["rust_ext", "cython_ext"]

[tool.uv.sources]
sparkhttp-rs = { workspace = true }
sparkhttp-cy = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
