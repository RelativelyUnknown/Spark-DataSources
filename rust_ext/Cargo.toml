[package]
name = "sparkhttp_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "sparkhttp_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
arrow = { version = "60", default-features = false, features = ["pyarrow"] }
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
