[package]
name = "sparkhttp_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "sparkhttp_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
arrow = { version = "60", default-features = false, features = ["pyarrow", "json", "chrono-tz"] }
ureq = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
futures-util = "0.3"
h3o = "0.11"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
unicode-segmentation = "1"
parquet = { version = "60", features = ["arrow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
flate2 = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
